<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#172b4d;background:transparent}h4{margin:0 0 8px}.frame{max-width:480px}video,img{width:100%;max-height:270px;object-fit:contain;background:#eef2f6;border-radius:8px}button,select{font:inherit;padding:9px;border:1px solid #bbc7d3;border-radius:6px;background:white;color:#172b4d;cursor:pointer}button.primary{background:#235789;color:white;border-color:#235789}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}#status{margin:8px 0;font-size:13px}select{width:100%;margin-top:6px}[hidden]{display:none!important}</style></head><body>
<div class="frame"><h4 id="label">Câmera</h4><video id="video" autoplay playsinline muted hidden></video><img id="preview" alt="Foto capturada" hidden><p id="status" role="status">Preparando câmera traseira…</p><select id="devices" aria-label="Selecionar câmera" hidden></select><div class="actions"><button id="start" type="button">Abrir câmera traseira</button><button id="capture" class="primary" type="button" disabled>Capturar foto</button><button id="native" type="button">Tirar foto pelo celular</button><button id="clear" type="button" hidden>Nova captura</button></div><input id="file" type="file" accept="image/*" capture="environment" hidden></div><script src="camera.js"></script></body></html>
